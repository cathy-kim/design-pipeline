<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>{{brandName}} moodboard</title>
<style>{{{css}}}
.mb{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:calc(16px*var(--u))}
.mb .tile{position:relative;overflow:hidden;border-radius:var(--r-card);min-height:0}
.mb .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mb .tile.wide{grid-column:span 2}.mb .tile.tall{grid-row:span 2}
.cap{position:absolute;left:calc(12px*var(--u));bottom:calc(12px*var(--u));background:var(--c-bg);color:var(--c-fg);padding:calc(4px*var(--u)) calc(10px*var(--u));border-radius:var(--r-tag);font-size:calc(18px*var(--u))}
.info{display:flex;justify-content:space-between;align-items:center;gap:calc(24px*var(--u));padding:calc(16px*var(--u)) calc(20px*var(--u));border:1px solid var(--c-muted);border-radius:var(--r-card)}
.sw{display:flex;gap:calc(16px*var(--u))}
.sw-item{display:flex;align-items:center;gap:calc(10px*var(--u))}
.chip{width:calc(48px*var(--u));height:calc(48px*var(--u));border-radius:var(--r-tag);border:1px solid var(--c-muted)}
.sw span{font-size:calc(16px*var(--u));color:var(--c-muted)}
.spec{font-family:var(--f-head);font-size:calc(40px*var(--u));font-weight:800;line-height:1.1}
</style></head>
<body>
<div class="frame" style="display:flex;flex-direction:column;gap:calc(24px*var(--u));padding:calc(48px*var(--u)) calc(60px*var(--u))">
  <header style="display:flex;justify-content:space-between;align-items:baseline">
    <h1 class="h-md">{{brandName}}{{#title}} — {{title}}{{/title}}</h1>
    <span class="t-small">{{mood}}</span>
  </header>
  <div class="info">
    <div class="sw">{{#swatches}}<div class="sw-item"><div class="chip" style="background:{{hex}}"></div><span>{{label}}<br>{{hex}}</span></div>{{/swatches}}</div>
    <div style="text-align:right"><p class="spec">Aa 가나</p><p class="t-small">{{fontHeading}} / {{fontBody}}</p></div>
  </div>
  <div class="mb">
    {{#tiles}}<div class="tile {{span}}"><img src="{{image}}" alt="">{{#caption}}<span class="cap">{{caption}}</span>{{/caption}}</div>{{/tiles}}
  </div>
</div>
</body></html>
